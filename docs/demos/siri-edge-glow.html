<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siri Edge Glow — AppleEfx verbatim (oryzo.ai)</title>
<style>
  html,body{margin:0;height:100%;background:#100904;overflow:hidden;
    font-family:system-ui,sans-serif;color:#ffedd7}
  #c{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!--
  Glow de borda do oryzo.ai — classe AppleEfx, SHADER VERBATIM (fragmentShader$3
  do bundle _astro/hoisted.CRsATKbF.js). Sem fumaça, sem mouse.

  A "rotação que deixa a borda mais forte onde passa e avança pro centro" vem de:
    - a paleta de 4 cores é amostrada por uma UV ROTACIONADA pelo tempo (u_time*-5)
    - a cor é elevada ao cubo (col*col*col*2.) -> onde a cor é brilhante o glow
      fica muito mais intenso e alcança mais pra dentro = "líquido mexendo".
  O u_pulse é uma onda que nasce na borda direita e empurra a borda pro centro
  (deslocando o SDF). Aqui ele varre em loop só pra você ver esse avanço.
-->
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:false, alpha:false});

const ROT_SPEED   = 5.0;   // u_time*-5 no original (u_time em segundos)
const PULSE_PERIOD = 6.0;  // s entre varreduras do pulse (0 = desliga)

const vert = `attribute vec2 p; varying vec2 v_uv;
void main(){ v_uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

// ===== fragmentShader$3 (AppleEfx) — lógica verbatim do bundle =====
const frag = `precision highp float;
varying vec2 v_uv;
uniform vec2  u_resolution, u_coverAspect, u_pulseCenter;
uniform float u_time, u_amount, u_padding, u_pulse, u_rotSpeed;
uniform vec3  c0,c1,c2,c3;

float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float linearstep(float a,float b,float x){ return clamp((x-a)/(b-a),0.,1.); }

void main(){
  float bn = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
  vec2 aspect = vec2(u_resolution.x/u_resolution.y, 1.);

  // --- cor que flui: UV da paleta ROTACIONADA pelo tempo ---
  vec2 glowUv = (v_uv-0.5)*u_coverAspect*2.;
  float angle = u_time*-u_rotSpeed;
  mat2 rot = mat2(cos(angle),-sin(angle), sin(angle),cos(angle));
  glowUv = rot*glowUv; glowUv = glowUv*.5+.5; glowUv = clamp(glowUv, vec2(0.), vec2(1.));
  vec3 colorT = mix(c0,c1,glowUv.x);
  vec3 colorB = mix(c3,c2,glowUv.x);
  vec3 glowColor = mix(colorB,colorT,glowUv.y);
  glowColor *= glowColor*glowColor*2.;            // hotspot: onde brilha, brilha MUITO

  // --- onda/pulse: nasce na borda direita e empurra a borda pro centro ---
  vec2 wp = (v_uv-u_pulseCenter)*aspect;
  float wl = length(aspect);
  float wpl = wl-length(wp);
  float wsl = 0.5*wl, wel = 0.5*wl, wtl = wl+wsl+wel;
  float wt = u_pulse*wtl - wl + wpl;
  float w0 = smoothstep(0., wsl, wt);
  float w1 = smoothstep(wsl+wel, wsl, wt);
  float wd = abs(wt-wsl);
  float wave = w0*w1*u_amount;
  vec2 waveDir = normalize(wp+1e-6);

  // --- SDF da moldura (deslocada pela onda -> avança pro centro) ---
  vec2 borderUv = (v_uv-0.5)*u_resolution + waveDir*wave*0.01*u_resolution.x;
  float d = sdBox(borderUv, u_resolution*0.5-u_padding*2.) - u_padding;
  d = linearstep(0., u_padding*2.5, d); d = pow(d, 3.0);
  float d2 = sdBox(borderUv, u_resolution*0.5-u_padding*3.) - u_padding*1.5;
  d2 = linearstep(0., u_padding*5.5, d2); d2 = pow(d2, 5.);

  // --- fundo escuro (no original aqui entra a cena renderizada) ---
  vec3 bg = vec3(0.063,0.035,0.016);
  bg += 0.015*vec3(1.,0.6,0.3)*(1.-length(v_uv-0.5));
  vec3 color = pow(bg, vec3(2.2));

  float glow = (0.001 + d + d2*0.5)*5.;
  color += u_amount*glowColor*glow;               // glow some nas bordas
  color += wave*(d*0.25 + d2*0.25 + glowColor*0.05);
  color = min(color, 1.);
  gl_FragColor = vec4(pow(color, vec3(1.0/2.2)) + bn*0.004, 1.0);
}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vert));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,frag));
gl.linkProgram(prog); gl.useProgram(prog);

const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U=n=>gl.getUniformLocation(prog,n);
// paleta real do oryzo (sRGB -> linear)
const srgb=h=>{const v=parseInt(h.slice(1),16);return [((v>>16)&255)/255,((v>>8)&255)/255,(v&255)/255]
  .map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4));};
gl.uniform3fv(U('c0'),srgb('#ff9cff'));
gl.uniform3fv(U('c1'),srgb('#ff9638'));
gl.uniform3fv(U('c2'),srgb('#ffff22'));
gl.uniform3fv(U('c3'),srgb('#54ffff'));
gl.uniform1f(U('u_rotSpeed'),ROT_SPEED);
gl.uniform1f(U('u_amount'),1.0);

// coverAspect EXATO do AppleEfx.render()
function coverAspect(){
  const W=cv.width,H=cv.height;
  const i=Math.min(H/W,1)/Math.sqrt(W*W+H*H)*Math.max(W,H);
  return [W/H*i, i];
}
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  gl.viewport(0,0,cv.width,cv.height);
  gl.uniform2f(U('u_resolution'),cv.width,cv.height);
  const ca=coverAspect(); gl.uniform2f(U('u_coverAspect'),ca[0],ca[1]);
  gl.uniform1f(U('u_padding'),Math.min(50,Math.min(cv.width,cv.height)*0.1));
}
addEventListener('resize',resize); resize();

const t0=performance.now()/1000;
let pulse=1;
(function loop(now){
  now=now/1000; const t=now-t0;
  gl.uniform1f(U('u_time'),t);
  // pulse += dt*0.5 no original (varre em ~2s). Aqui reinicia a cada PULSE_PERIOD.
  if(PULSE_PERIOD>0){ const ph=(t % PULSE_PERIOD); pulse=Math.min(1, ph*0.5); }
  gl.uniform1f(U('u_pulse'),pulse);
  gl.uniform2f(U('u_pulseCenter'),1.001,0.5);   // borda direita (no site: ligado ao scroll)
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
